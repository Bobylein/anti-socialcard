# Curated additions and corrections for initiatives not fully covered by the
# Seebrücke scraper. Keep ids stable; they are used for overrides and links.

overrides:
  - match:
      name: Fürth
      region: Bayern
      country: Deutschland
    coordinates:
      lat: 49.4771169
      lon: 10.988667
      label: Fürth, Bayern, Deutschland
    transitLinks:
      - label: VGN
        url: https://www.vgn.de/

  - match:
      name: Berlin/Brandenburg
      region: Berlin
      country: Deutschland
    city: Berlin
    coordinates:
      lat: 52.520008
      lon: 13.404954
      label: Berlin, Deutschland
    transitLinks:
      - label: BVG
        url: https://www.bvg.de/
      - label: VBB
        url: https://www.vbb.de/

  - match:
      name: Graz
      region: Österreich
      country: Österreich
    transitLinks:
      - label: Verbund Linie
        url: https://www.verbundlinie.at/

initiatives:
  - id: eutin
    name: Anti-SocialCard OH
    city: Eutin
    region: Schleswig-Holstein
    country: Deutschland
    url: https://linktr.ee/AntiSocialCardOH
    locations:
      - name: Alberta!
        address: Albert-Mahlstedt Str. 65, 23701 Eutin
        openingHours: Freitags, 15:00 – 18:00 Uhr
        updatedAt: 2026-06-04
      - name: Forum e.V.
        adress: Bismarckstr. 2, 23701 Eutin
        openingHours: Jeden 1. Dienstag im Monat 10:00 – 12:00 Uhr


